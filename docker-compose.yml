services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cueai-db
    environment:
      POSTGRES_USER: cueai
      POSTGRES_PASSWORD: cueai
      POSTGRES_DB: cueai
    ports:
      - "5432:5432"
    volumes:
      - cueai-pgdata:/var/lib/postgresql/data
      # No initdb mount: the server applies server/schema.sql itself on every
      # boot (see NewStore). One code path here and on Nexlayer, where the
      # postgres pod has no way to mount an init script.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cueai -d cueai"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  cueai-pgdata:
